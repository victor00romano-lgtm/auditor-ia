services:
  auditor-api:
    image: auditor-ia-mvp:latest
    build: .
    ports: ["127.0.0.1:8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      AUDITOR_API_KEY: ${AUDITOR_API_KEY:-}
      AI_PRIVACY_MODE: ${AI_PRIVACY_MODE:-anonymize}
      ALLOW_PII_TO_AI: ${ALLOW_PII_TO_AI:-false}
      API_AUDIT_TIMEOUT: ${API_AUDIT_TIMEOUT:-5m}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      DATABASE_URL: postgres://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:-LOCAL_DEVELOPMENT_PLACEHOLDER}@postgres:5432/auditor_ia?sslmode=disable
      METRICS_ADDR: :9091
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: auditor-api
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    volumes: ["./reports:/reports"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
  auditor-tui:
    profiles: ["tools"]
    image: auditor-ia-mvp:latest
    build: .
    entrypoint: ["/auditor"]
    init: true
    stdin_open: true
    tty: true
    user: "65532:65532"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      AI_PRIVACY_MODE: ${AI_PRIVACY_MODE:-anonymize}
      ALLOW_PII_TO_AI: ${ALLOW_PII_TO_AI:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      DATABASE_URL: postgres://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:-LOCAL_DEVELOPMENT_PLACEHOLDER}@postgres:5432/auditor_ia?sslmode=disable
      REPORTS_DIR: /reports
      RULES_FILE: /configs/rules.yaml
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    volumes: ["./reports:/reports"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_signal: SIGINT
  audit-worker:
    image: auditor-ia-mvp:latest
    build: .
    entrypoint: ["/auditworker"]
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_HTTP_TIMEOUT: ${BITRIX_HTTP_TIMEOUT:-30s}
      BITRIX_MAX_CONCURRENCY: ${BITRIX_MAX_CONCURRENCY:-3}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_HTTP_TIMEOUT: ${OLLAMA_HTTP_TIMEOUT:-9m}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      API_AUDIT_TIMEOUT: ${API_AUDIT_TIMEOUT:-10m}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-2}
      AUDIT_MAX_ATTEMPTS: ${AUDIT_MAX_ATTEMPTS:-5}
      AUDIT_LEASE_DURATION: ${AUDIT_LEASE_DURATION:-15m}
      AUDIT_QUEUE_POLL_INTERVAL: ${AUDIT_QUEUE_POLL_INTERVAL:-1s}
      AI_PRIVACY_MODE: ${AI_PRIVACY_MODE:-anonymize}
      ALLOW_PII_TO_AI: ${ALLOW_PII_TO_AI:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:-LOCAL_DEVELOPMENT_PLACEHOLDER}@postgres:5432/auditor_ia?sslmode=disable
      RULES_FILE: /configs/rules.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: auditor_ia
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LOCAL_DEVELOPMENT_PLACEHOLDER}
    volumes: ["postgres:/var/lib/postgresql/data"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d auditor_ia"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    security_opt: ["no-new-privileges:true"]
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [tempo]
    security_opt: ["no-new-privileges:true"]
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    security_opt: ["no-new-privileges:true"]
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-LOCAL_DEVELOPMENT_PLACEHOLDER}
    volumes:
      - grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]
    security_opt: ["no-new-privileges:true"]
volumes:
  grafana:
  ollama:
  postgres:
  prometheus:
  tempo:
